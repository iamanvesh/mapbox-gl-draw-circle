name: Release

# Manual release to npm with staged publishing. Run it from the Actions tab: "Release" →
# "Run workflow" on master. Full instructions: RELEASING.md.
#
# Before running it, commit to master:
#   1. the new version in package.json (npm version <x.y.z> --no-git-tag-version), and
#   2. a "## [x.y.z] - YYYY-MM-DD" section in CHANGELOG.md (used as the GitHub release notes).
#
# The workflow then:
#   - checks the version isn't on npm yet and has no tag or GitHub release;
#   - runs the full CI suite (unit matrix, browser tests, consumer fixtures) on the exact commit;
#   - dry run (default): packs the package and prints what would be staged, then stops;
#   - real run: stages the version on npm with `npm stage publish` (trusted publishing, OIDC, no
#     token; provenance attached) and creates a *draft* GitHub release. Nothing is public yet.
#
# The maintainer then approves on npm with 2FA (`npm stage approve <id>`), which makes the version
# live, and publishes the draft GitHub release, which creates the vX.Y.Z tag. CI can only stage:
# a compromised workflow or GitHub account cannot release without the maintainer's npm 2FA.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run (pack and validate only, nothing is staged)
        type: boolean
        default: true
      dist-tag:
        description: npm dist-tag (prerelease versions such as 2.1.0-beta.1 must use "next")
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: check
        name: Check branch, version, tag, release and changelog
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$GITHUB_REF" = "refs/heads/master" ] || fail "Releases run from master only (got $GITHUB_REF)."

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Releasing $name@$version (dist-tag: $DIST_TAG)"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            fail "$name@$version is already on npm. Bump the version in package.json first."
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            fail "Tag v$version already exists."
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            fail "A GitHub release (possibly a draft) for v$version already exists. Delete it or bump the version."
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || fail "CHANGELOG.md has no '## [$version]' section."

          case "$version" in
            *-*) [ "$DIST_TAG" = "next" ] || fail "Prerelease $version must be published with dist-tag 'next'." ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    uses: ./.github/workflows/ci.yml

  dry-run:
    name: Dry run (nothing staged)
    if: inputs.dry-run
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pack
        run: npm pack --dry-run
      - name: Release notes
        run: node .github/scripts/release-notes.mjs "${{ needs.prepare.outputs.version }}"
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          {
            echo "### Dry run passed for v$VERSION"
            echo "Re-run with **Dry run** unchecked to stage it on npm with dist-tag \`$DIST_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

  stage:
    name: Stage on npm
    if: ${{ !inputs.dry-run }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    # Must match the environment set on npm's trusted publisher. Its deployment-branch rule keeps
    # the npm OIDC trust usable only from master.
    environment: npm-release
    permissions:
      contents: write # create the draft GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5
      # No registry-url here: it makes setup-node write a placeholder _authToken, which npm falls
      # back to when the OIDC exchange fails, hiding the real error behind a generic E401.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Staged publishing with trusted publishing needs a current npm.
      - run: npm install -g npm@latest && npm --version
      - name: Stage
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
          # Logs the OIDC token exchange with npm, so a trusted-publisher mismatch is visible.
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm stage publish --access public --provenance --tag "$DIST_TAG"
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/release-notes.mjs "$VERSION" > notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # A draft creates no tag yet; vX.Y.Z is created when the draft is published.
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md $prerelease
      - name: Next steps
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Staged mapbox-gl-draw-circle@$VERSION (not public yet)"
            echo ""
            echo "On your machine, logged in to npm as a maintainer:"
            echo ""
            echo '```sh'
            echo "npm stage list mapbox-gl-draw-circle      # find the stage id for $VERSION"
            echo "npm stage download <stage-id>             # optional: inspect the tarball"
            echo "npm stage approve <stage-id>              # asks for 2FA, then $VERSION is live"
            echo "gh release edit v$VERSION --draft=false   # publish the GitHub release and create the tag"
            echo '```'
            echo ""
            echo "To abandon: \`npm stage reject <stage-id>\` and delete the draft release."
          } >> "$GITHUB_STEP_SUMMARY"
