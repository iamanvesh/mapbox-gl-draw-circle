name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by release.yml as its test gate.
  workflow_call:
  schedule:
    # Weekly run against the newest @mapbox/mapbox-gl-draw, to catch upstream breakage early.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  # Keyed by event too, so a release's test run (workflow_call from workflow_dispatch) is never
  # cancelled by, and never cancels, the CI run of a push to the same branch.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unit:
    name: Unit (node ${{ matrix.node }}, draw ${{ matrix.draw }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported Node versions on the pinned draw version...
          - { node: 20, draw: 1.5.2 }
          - { node: 22, draw: 1.5.2 }
          - { node: 24, draw: 1.5.2 }
          # ...and the supported draw range (peerDependency >=1.4.0) on current Node.
          - { node: 24, draw: 1.4.0 }
          - { node: 24, draw: 1.4.3 }
          - { node: 24, draw: 1.5.0 }
          - { node: 24, draw: latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use @mapbox/mapbox-gl-draw@${{ matrix.draw }}
        run: npm install --no-save @mapbox/mapbox-gl-draw@${{ matrix.draw }}
      - run: npm test

  e2e:
    name: Browser (mapbox-gl v3, draw ${{ matrix.draw }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        draw: [1.4.3, 1.5.2, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/demo/package-lock.json
      # Root install provides the plugin's own dependencies (turf) to the linked package.
      - run: npm ci
      - run: npm ci
        working-directory: examples/demo
      - name: Use @mapbox/mapbox-gl-draw@${{ matrix.draw }}
        run: npm install --no-save @mapbox/mapbox-gl-draw@${{ matrix.draw }}
        working-directory: examples/demo
      - run: npx playwright install --with-deps chromium
        working-directory: examples/demo
      - run: npx playwright test
        working-directory: examples/demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-draw-${{ matrix.draw }}
          path: |
            examples/demo/playwright-report/
            examples/demo/test-results/
          retention-days: 14

  e2e-maplibre:
    name: Browser (maplibre-gl, draw 1.5.2, best effort)
    runs-on: ubuntu-latest
    # MapLibre is best effort: mapbox-gl-draw doesn't officially support it, so a failure here
    # is a warning to look into, not a release blocker.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/demo/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: examples/demo
      - run: npx playwright install --with-deps chromium
        working-directory: examples/demo
      - run: npx playwright test
        working-directory: examples/demo
        env:
          VITE_MAP_ENGINE: maplibre
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-maplibre
          path: |
            examples/demo/playwright-report/
            examples/demo/test-results/
          retention-days: 14

  fixtures:
    name: Consumer build (${{ matrix.app }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [node, typescript, webpack, react-vite, vue-vite, angular, next]
        node: [24]
        include:
          # CommonJS require() of the ESM package depends on Node's require(esm) support.
          - { app: node, node: 20 }
          - { app: node, node: 22 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/package-lock.json
      - run: npm ci
        working-directory: fixtures
      - run: npx playwright install --with-deps chromium
        working-directory: fixtures
      # Packs the repo, installs the tarball into a fresh copy of the app, builds it and,
      # for browser apps, smoke-tests the built output.
      - run: node fixtures/run.mjs ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fixture-${{ matrix.app }}-node${{ matrix.node }}
          path: fixtures/test-results/
          retention-days: 14
